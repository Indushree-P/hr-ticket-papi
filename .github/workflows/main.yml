name: PAPI CI

on:
  push:
    branches:
      - development

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Verify Maven
        run: mvn -version
